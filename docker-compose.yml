services:
  db:
    image: pgvector/pgvector:pg16
    container_name: oncopath-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: oncopath
    ports:
      - "35432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build:
      context: ./app
    container_name: oncopath-app
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/oncopath
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-OncoPath2026!}
      - ADMIN_SECRET=${ADMIN_SECRET:-oncopath_evidence_admin_secret_key_2026}
      - GUEST_SESSION_SECRET=${GUEST_SESSION_SECRET:-oncopath_guest_hmac_secret_2026}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:38030}
    volumes:
      - app_data:/app/data
    ports:
      - "38030:3000"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
  app_data:
